services:
  vision-perception:
    build:
      context: .
      dockerfile: app.Dockerfile
    image: vision-perception-app:latest
    network_mode: host
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "30012"
      WEB_CONCURRENCY: "4"
      GUNICORN_THREADS: "16"
      APP_INTERNAL_BASE_URL: http://127.0.0.1:30012
      SCENE_MINING_MEDIA_BASE_URL: "${SCENE_MINING_MEDIA_BASE_URL:-http://127.0.0.1:30012}"
      OSS_PUBLIC_BASE_URL: /media
      PYTHONPATH: /app
      EMBEDDING_MODEL: qwen3-vl
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      QWEN3_VL_EMBEDDING_BASE_URL: http://127.0.0.1:30049/v1
      QWEN3_VL_EMBEDDING_MODEL_NAME: Qwen3-VL-Embedding-8B
      QWEN3_VL_EMBEDDING_DIM: "4096"
      QWEN3_VL_EMBEDDING_TIMEOUT: "300"
      QWEN3_VL_EMBEDDING_RETRIES: "2"
      QWEN3_VL_EMBEDDING_RETRY_BACKOFF: "1"
      SCENE_MINING_API_BASE_URL: http://127.0.0.1:30049/v1
      SCENE_MINING_API_MODEL_NAME: "${SCENE_MINING_API_MODEL_NAME:-Qwen3-VL-32B-Instruct}"
      SCENE_MINING_CONFIG_PATH: /app/app/algorithm/scene_mining/config-qwen-gemini.yaml
      SCENE_MINING_OUTPUT_DIR: /app/outputs/scene_mining
      SCENE_MINING_TOOL_CLIP_DIR: /app/outputs/scene_mining/_tool_clips
      SCENE_MINING_VIDEO_CACHE_DIR: /app/data/scene_mining_videos
      SCENE_MINING_VIDEO_URL_PREFIX: file:///app/videos
      SCENE_MINING_MEDIA_URL_TTL_SECONDS: "7200"
      SCENE_MINING_SUMMARY_MAX_TOKENS: "4096"
      FRAME_SAMPLE_FPS: "1"
      FRAME_SAMPLE_MAX_FRAMES: "20"
      FRAME_SAMPLE_EVENT_FPS: "1"
      FRAME_SAMPLE_EVENT_WEIGHT: "1.5"
      RAWDATA_REQUEST_TIMEOUT: "3"
      MEDIA_CACHE_DIR: /app/data/media_cache
      MEDIA_CACHE_MAX_AGE: "3600"
      TASK_STATUS_DIR: /app/data/task_status
      UPLOAD_LOCK_DIR: /app/data/locks
      ENABLE_LEGACY_VIDEO_PROXY: "false"
      MILVUS_VIDEO_COLLECTION_NAME: video_vector_qwen3vl8b_4096
      MILVUS_VIDEO_FRAME_COLLECTION_NAME: video_frame_vector_qwen3vl8b_4096
      MILVUS_VIDEO_TEXT_FEATURE_COLLECTION_NAME: video_text_features_qwen3vl8b_4096
      MILVUS_VIDEO_VISUAL_FEATURE_COLLECTION_NAME: video_visual_features_qwen3vl8b_4096
    volumes:
      - /mnt/data/ai-ground/dataset/videos:/app/videos:ro
      - ./outputs:/app/outputs
      - ./data:/app/data
